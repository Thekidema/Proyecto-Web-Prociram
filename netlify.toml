[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security       = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options          = "nosniff"
    X-Frame-Options                 = "DENY"
    Referrer-Policy                 = "strict-origin-when-cross-origin"
    Permissions-Policy              = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
    Cross-Origin-Opener-Policy      = "same-origin"
    Cross-Origin-Resource-Policy    = "same-origin"
    Content-Security-Policy         = "default-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; worker-src 'none'; upgrade-insecure-requests"

# Caché agresivo para assets con hash en el nombre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
