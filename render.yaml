services:
  - type: web
    name: prociram
    env: static
    staticPublishPath: .
    buildCommand: ""

    headers:
      # — Security headers globales
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload

      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      - path: /*
        name: X-Frame-Options
        value: DENY

      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"

      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin

      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin

      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; worker-src 'none'; upgrade-insecure-requests"

      # — Cache: assets inmutables
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # — Cache: HTML siempre fresco
      - path: /*.html
        name: Cache-Control
        value: no-cache, must-revalidate
